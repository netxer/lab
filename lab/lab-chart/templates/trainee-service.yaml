{{/*
Services to expose the trainee VM from outside the cluster.

The Services select against the launcher pod via the kubevirt.io/vm label,
and route traffic to the trainee through the *pod network* NIC (NIC2),
since that's the only NIC the cluster's CNI sees.

Use type: LoadBalancer instead if you have MetalLB or a cloud LB available.
*/}}
{{- if .Values.includeTrainee }}
---
apiVersion: v1
kind: Service
metadata:
  name: trainee-{{ .Values.trainee.name }}-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: trainee-{{ .Values.trainee.name }}
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
---
apiVersion: v1
kind: Service
metadata:
  name: trainee-{{ .Values.trainee.name }}-rdp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: trainee-{{ .Values.trainee.name }}
  ports:
    - name: rdp
      protocol: TCP
      port: 3389
      targetPort: 3389
{{- end }}
