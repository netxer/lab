---
- name: Install and enable snapd
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Install snapd
      ansible.builtin.apt:
        name: snapd
        state: present
        update_cache: yes

    - name: Enable and start snapd socket
      ansible.builtin.systemd:
        name: snapd.socket
        enabled: yes
        state: started

    - name: Enable and start snapd service
      ansible.builtin.systemd:
        name: snapd
        enabled: yes
        state: started

    - name: Check if /snap already exists
      ansible.builtin.stat:
        path: /snap
      register: snap_path

    - name: Create symlink for snap classic confinement
      ansible.builtin.file:
        src: /var/lib/snapd/snap
        dest: /snap
        state: link
        force: yes
      when:
        - ansible_facts['distribution'] == "Ubuntu"
        - not snap_path.stat.exists

    - name: Verify snap is functional
      ansible.builtin.command: snap version
      register: snap_version
      changed_when: false

    - name: Display snap version
      ansible.builtin.debug:
        msg: "{{ snap_version.stdout }}"
