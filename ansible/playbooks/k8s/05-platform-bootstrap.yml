---
# Bootstraps the KubeVirt platform on the K8s cluster.
# Deploys HCO (KubeVirt, CDI, CNAO) + kubernetes-nmstate + NNCP bridges + NFD rules.
# Run from the control node (needs kubectl access).
# Usage: ansible-playbook -i ../inv/ansible_inventory.ini 05-platform-bootstrap.yml
- name: Bootstrap KubeVirt platform (HCO + NMState + NNCP + NFD)
  hosts: control[0]
  become: no
  vars:
    kubeconfig: "{{ kubeconfig | default('/home/ubuntu/.kube/config') }}"
    kubevirt_namespace: "{{ kubevirt_namespace | default('kubevirt-hyperconverged') }}"
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Check kubectl connectivity
      ansible.builtin.command: kubectl get nodes
      register: kubectl_check
      changed_when: false
      failed_when: kubectl_check.rc != 0

    - name: Display cluster nodes
      ansible.builtin.debug:
        msg: "{{ kubectl_check.stdout_lines }}"

    - name: Create kubevirt-hyperconverged namespace
      ansible.builtin.shell: >
        kubectl create namespace {{ kubevirt_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Create kubevirt-cluster-critical PriorityClass (required before any KubeVirt operator starts)
      ansible.builtin.shell: |
        kubectl apply --server-side --force-conflicts -f - <<'EOF'
        apiVersion: scheduling.k8s.io/v1
        kind: PriorityClass
        metadata:
          name: kubevirt-cluster-critical
        value: 1000000000
        globalDefault: false
        description: Priority class for KubeVirt platform components
        EOF
      args:
        executable: /bin/bash
      register: pc_apply
      changed_when: "'created' in pc_apply.stdout or 'configured' in pc_apply.stdout"

    - name: Check if HCO operator is already deployed
      ansible.builtin.command: kubectl get deployment hyperconverged-cluster-operator -n {{ kubevirt_namespace }}
      register: hco_exists
      changed_when: false
      failed_when: false

    - name: Download HCO deploy script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/kubevirt/hyperconverged-cluster-operator/main/deploy/deploy.sh
        dest: /tmp/hco-deploy.sh
        mode: '0755'
        force: true
      when: hco_exists.rc != 0

    - name: Install HCO operator via deploy script (CRDs + controller + cert-manager)
      ansible.builtin.shell: bash /tmp/hco-deploy.sh
      args:
        executable: /bin/bash
      register: hco_apply
      changed_when: "'created' in hco_apply.stdout"
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
        IS_OPENSHIFT: "false"
      when: hco_exists.rc != 0

    - name: Wait for HCO operator pod to be ready
      ansible.builtin.shell: |
        kubectl wait deployment/hyperconverged-cluster-operator \
          --for=condition=Available \
          --timeout=300s \
          -n {{ kubevirt_namespace }}
      args:
        executable: /bin/bash
      register: hco_op_ready
      changed_when: false

    - name: Apply HyperConverged CR (triggers KubeVirt + CDI + CNAO sub-operators)
      ansible.builtin.shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: hco.kubevirt.io/v1beta1
        kind: HyperConverged
        metadata:
          name: kubevirt-hyperconverged
          namespace: {{ kubevirt_namespace }}
        spec: {}
        EOF
      args:
        executable: /bin/bash
      register: hco_cr
      changed_when: "'configured' in hco_cr.stdout or 'created' in hco_cr.stdout"

    - name: Wait for HyperConverged to be Available (up to 15 min)
      ansible.builtin.command: >
        kubectl wait hco/kubevirt-hyperconverged
        --for=condition=Available
        --timeout=900s
        -n {{ kubevirt_namespace }}
      register: hco_ready
      changed_when: false

    - name: Install kubernetes-nmstate operator (NMState is not bundled in HCO)
      ansible.builtin.shell: |
        VERSION=$(curl -s https://api.github.com/repos/nmstate/kubernetes-nmstate/releases/latest \
          | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
        echo "Installing kubernetes-nmstate $VERSION"
        BASE=https://github.com/nmstate/kubernetes-nmstate/releases/download/${VERSION}
        kubectl apply --server-side --force-conflicts -f ${BASE}/nmstate.io_nmstates.yaml
        kubectl apply -f ${BASE}/namespace.yaml
        kubectl apply -f ${BASE}/service_account.yaml
        kubectl apply -f ${BASE}/role.yaml
        kubectl apply -f ${BASE}/role_binding.yaml
        kubectl apply --server-side --force-conflicts -f ${BASE}/operator.yaml
        kubectl apply -f ${BASE}/nmstate.io_v1_nmstate_cr.yaml
      args:
        executable: /bin/bash
      register: nmstate_install
      changed_when: "'created' in nmstate_install.stdout"

    - name: Wait for kubernetes-nmstate operator to be ready
      ansible.builtin.shell: |
        kubectl wait deployment/nmstate-operator \
          --for=condition=Available \
          --timeout=120s \
          -n nmstate
      args:
        executable: /bin/bash
      register: nmstate_ready
      changed_when: false

    - name: Copy NNCP manifest to control node
      ansible.builtin.copy:
        src: files/02-bridges.nncp.yaml
        dest: /tmp/02-bridges.nncp.yaml
        mode: '0644'

    - name: Apply VLAN-aware bridge NNCP
      ansible.builtin.command: kubectl apply -f /tmp/02-bridges.nncp.yaml
      register: nncp_apply
      changed_when: "'configured' in nncp_apply.stdout or 'created' in nncp_apply.stdout"

    - name: Check NNCP availability (non-blocking — requires NetworkManager on nodes)
      ansible.builtin.shell: |
        state=$(kubectl get nncp lab-bridges -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null)
        [ "$state" = "True" ] && echo "Available" || echo "Pending (install network-manager on nodes to activate)"
      args:
        executable: /bin/bash
      register: nncp_wait
      changed_when: false

    - name: Install Node Feature Discovery via kustomize
      ansible.builtin.shell: |
        VERSION=$(curl -s https://api.github.com/repos/kubernetes-sigs/node-feature-discovery/releases/latest \
          | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
        echo "Installing NFD $VERSION"
        kubectl apply --server-side --force-conflicts -k \
          https://github.com/kubernetes-sigs/node-feature-discovery/deployment/overlays/default?ref=${VERSION}
      args:
        executable: /bin/bash
      register: nfd_install
      changed_when: "'created' in nfd_install.stdout"

    - name: Wait for NFD master to be ready
      ansible.builtin.shell: |
        kubectl wait deployment/nfd-master \
          --for=condition=Available \
          --timeout=180s \
          -n node-feature-discovery 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Copy NFD rule manifest to control node
      ansible.builtin.copy:
        src: files/03-nfd-rules.yaml
        dest: /tmp/03-nfd-rules.yaml
        mode: '0644'

    - name: Apply NodeFeatureRule for KVM-capable nodes
      ansible.builtin.command: kubectl apply --server-side --force-conflicts -f /tmp/03-nfd-rules.yaml
      register: nfd_apply
      changed_when: "'configured' in nfd_apply.stdout or 'created' in nfd_apply.stdout"

    - name: Show lab-node labels
      ansible.builtin.command: kubectl get nodes -L lab-node
      register: node_labels
      changed_when: false

    - name: Platform bootstrap summary
      ansible.builtin.debug:
        msg:
          - "HCO:    {{ hco_ready.stdout }}"
          - "NMState: {{ 'ready' if nmstate_ready.rc == 0 else 'not ready' }}"
          - "NNCP:   {{ nncp_wait.stdout }}"
          - "NFD:    {{ nfd_apply.stdout if nfd_apply.changed else 'unchanged' }}"
          - "Nodes:  {{ node_labels.stdout_lines }}"
