---
# Refresh local kubectl access for an ephemeral cluster lab.
#
# Usage:
#   ansible-playbook -i ../../inv/ansible_inventory.ini local-kubeconfig.yml
#
# Optional overrides:
#   -e "k8s_api_host=control-node-1"
#   -e "k8s_context_name=k8s-lab"
#   -e "make_current_context=false"

- name: Configure local kubeconfig for the current cluster lab
  hosts: control[0]
  become: yes
  gather_facts: yes
  vars:
    remote_kubeconfig_candidates:
      - /etc/rancher/k3s/k3s.yaml
      - /etc/kubernetes/admin.conf
    k8s_context_name: k8s-lab
    k8s_api_port: 6443
    make_current_context: true

    local_kubeconfig_dir: "{{ lookup('env', 'HOME') }}/.kube"
    local_kubeconfig_path: "{{ local_kubeconfig_dir }}/config"
    local_cluster_kubeconfig_path: "{{ local_kubeconfig_dir }}/{{ k8s_context_name }}.yaml"

    cluster_name: "{{ k8s_context_name }}"
    cluster_user_name: "{{ k8s_context_name }}-admin"
    cluster_server_host: "{{ k8s_api_host | default(ansible_host | default(ansible_facts.default_ipv4.address)) }}"
    cluster_server_name: "{{ k8s_api_server_name | default(ansible_hostname | default(inventory_hostname)) }}"
    cluster_server_url: "https://{{ cluster_server_host }}:{{ k8s_api_port }}"

  tasks:
    - name: Check remote cluster kubeconfig exists
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ remote_kubeconfig_candidates }}"
      register: remote_kubeconfig_stats

    - name: Select remote cluster kubeconfig path
      ansible.builtin.set_fact:
        remote_kubeconfig_path: "{{ (remote_kubeconfig_stats.results | selectattr('stat.exists') | map(attribute='item') | first) | default('') }}"

    - name: Fail when cluster kubeconfig is not available yet
      ansible.builtin.fail:
        msg: >-
          None of the expected kubeconfigs were found on {{ inventory_hostname }}.
          Run the cluster bootstrap playbooks first.
      when: remote_kubeconfig_path == ''

    - name: Read remote cluster kubeconfig
      ansible.builtin.slurp:
        src: "{{ remote_kubeconfig_path }}"
      register: remote_kubeconfig_raw

    - name: Parse remote kubeconfig
      ansible.builtin.set_fact:
        remote_kubeconfig_data: "{{ remote_kubeconfig_raw.content | b64decode | from_yaml }}"

    - name: Build local kubeconfig for this lab
      ansible.builtin.set_fact:
        local_cluster_kubeconfig:
          apiVersion: v1
          kind: Config
          preferences: {}
          clusters:
            - name: "{{ cluster_name }}"
              cluster: "{{ remote_kubeconfig_data.clusters[0].cluster | combine({'server': cluster_server_url, 'tls-server-name': cluster_server_name}) }}"
          users:
            - name: "{{ cluster_user_name }}"
              user: "{{ remote_kubeconfig_data.users[0].user }}"
          contexts:
            - name: "{{ k8s_context_name }}"
              context:
                cluster: "{{ cluster_name }}"
                user: "{{ cluster_user_name }}"
          current-context: "{{ k8s_context_name }}"

    - name: Ensure local kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ local_kubeconfig_dir }}"
        state: directory
        mode: '0700'
      become: no
      delegate_to: localhost

    - name: Write refreshed lab kubeconfig locally
      ansible.builtin.copy:
        content: "{{ local_cluster_kubeconfig | to_nice_yaml(indent=2) }}"
        dest: "{{ local_cluster_kubeconfig_path }}"
        mode: '0600'
      become: no
      delegate_to: localhost

    - name: Check whether local kubectl is installed
      ansible.builtin.command: kubectl version --client=true
      register: local_kubectl
      changed_when: false
      failed_when: false
      become: no
      delegate_to: localhost

    - name: Merge lab context into default local kubeconfig
      ansible.builtin.shell: |
        set -euo pipefail
        tmp_file="$(mktemp)"
        KUBECONFIG="{{ local_kubeconfig_path }}:{{ local_cluster_kubeconfig_path }}" kubectl config view --flatten > "${tmp_file}"
        mv "${tmp_file}" "{{ local_kubeconfig_path }}"
        chmod 0600 "{{ local_kubeconfig_path }}"
      args:
        executable: /bin/bash
      changed_when: true
      become: no
      delegate_to: localhost
      when: local_kubectl.rc == 0

    - name: Select lab context in default local kubeconfig
      ansible.builtin.command: >
        kubectl --kubeconfig {{ local_kubeconfig_path }}
        config use-context {{ k8s_context_name }}
      changed_when: true
      become: no
      delegate_to: localhost
      when:
        - local_kubectl.rc == 0
        - make_current_context | bool

    - name: Verify local cluster access
      ansible.builtin.command: >
        kubectl --kubeconfig {{ local_kubeconfig_path if local_kubectl.rc == 0 else local_cluster_kubeconfig_path }}
        get nodes -o wide
      register: local_nodes
      changed_when: false
      failed_when: false
      become: no
      delegate_to: localhost

    - name: Show local kubeconfig result
      ansible.builtin.debug:
        msg:
          - "Wrote: {{ local_cluster_kubeconfig_path }}"
          - "API: {{ cluster_server_url }}"
          - "{{ 'Merged into: ' ~ local_kubeconfig_path if local_kubectl.rc == 0 else 'kubectl is not installed locally; use KUBECONFIG=' ~ local_cluster_kubeconfig_path ~ ' after installing kubectl.' }}"
          - "{{ 'Current context: ' ~ k8s_context_name if local_kubectl.rc == 0 and make_current_context | bool else 'Current context unchanged.' }}"
          - "{{ local_nodes.stdout_lines if local_nodes.rc == 0 else 'Local kubectl verification skipped or failed: ' ~ local_nodes.stderr }}"
