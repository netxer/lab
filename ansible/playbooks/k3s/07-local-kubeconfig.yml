---
# Refresh local kubectl access for an ephemeral k3s lab.
#
# Usage:
#   ansible-playbook -i ../../inv/ansible_inventory.ini 07-local-kubeconfig.yml
#
# Optional overrides:
#   -e "k3s_api_host=control-node-1"
#   -e "k3s_context_name=k3s-lab"
#   -e "make_current_context=false"

- name: Configure local kubeconfig for the current k3s lab
  hosts: control[0]
  become: yes
  gather_facts: yes
  vars:
    k3s_remote_kubeconfig: /etc/rancher/k3s/k3s.yaml
    k3s_context_name: k3s-lab
    k3s_api_port: 6443
    make_current_context: true

    local_kubeconfig_dir: "{{ lookup('env', 'HOME') }}/.kube"
    local_kubeconfig_path: "{{ local_kubeconfig_dir }}/config"
    local_k3s_kubeconfig_path: "{{ local_kubeconfig_dir }}/{{ k3s_context_name }}.yaml"

    k3s_cluster_name: "{{ k3s_context_name }}"
    k3s_user_name: "{{ k3s_context_name }}-admin"
    # Connect by IP so local DNS is not a requirement, but keep the cert name pinned to the k3s hostname.
    k3s_server_host: "{{ k3s_api_host | default(ansible_host | default(ansible_facts.default_ipv4.address)) }}"
    k3s_server_name: "{{ k3s_api_server_name | default(ansible_hostname | default(inventory_hostname)) }}"
    k3s_server_url: "https://{{ k3s_server_host }}:{{ k3s_api_port }}"

  tasks:
    - name: Check remote k3s kubeconfig exists
      ansible.builtin.stat:
        path: "{{ k3s_remote_kubeconfig }}"
      register: remote_kubeconfig

    - name: Fail when k3s kubeconfig is not available yet
      ansible.builtin.fail:
        msg: >-
          {{ k3s_remote_kubeconfig }} was not found on {{ inventory_hostname }}.
          Run the k3s bootstrap playbooks first.
      when: not remote_kubeconfig.stat.exists

    - name: Read remote k3s kubeconfig
      ansible.builtin.slurp:
        src: "{{ k3s_remote_kubeconfig }}"
      register: remote_kubeconfig_raw

    - name: Parse remote kubeconfig
      ansible.builtin.set_fact:
        remote_kubeconfig_data: "{{ remote_kubeconfig_raw.content | b64decode | from_yaml }}"

    - name: Build local kubeconfig for this lab
      ansible.builtin.set_fact:
        local_k3s_kubeconfig:
          apiVersion: v1
          kind: Config
          preferences: {}
          clusters:
            - name: "{{ k3s_cluster_name }}"
              cluster: "{{ remote_kubeconfig_data.clusters[0].cluster | combine({'server': k3s_server_url, 'tls-server-name': k3s_server_name}) }}"
          users:
            - name: "{{ k3s_user_name }}"
              user: "{{ remote_kubeconfig_data.users[0].user }}"
          contexts:
            - name: "{{ k3s_context_name }}"
              context:
                cluster: "{{ k3s_cluster_name }}"
                user: "{{ k3s_user_name }}"
          current-context: "{{ k3s_context_name }}"

    - name: Ensure local kubeconfig directory exists
      ansible.builtin.file:
        path: "{{ local_kubeconfig_dir }}"
        state: directory
        mode: '0700'
      become: no
      delegate_to: localhost

    - name: Write refreshed lab kubeconfig locally
      ansible.builtin.copy:
        content: "{{ local_k3s_kubeconfig | to_nice_yaml(indent=2) }}"
        dest: "{{ local_k3s_kubeconfig_path }}"
        mode: '0600'
      become: no
      delegate_to: localhost

    - name: Check whether local kubectl is installed
      ansible.builtin.command: kubectl version --client=true
      register: local_kubectl
      changed_when: false
      failed_when: false
      become: no
      delegate_to: localhost

    - name: Merge lab context into default local kubeconfig
      ansible.builtin.shell: |
        set -euo pipefail
        tmp_file="$(mktemp)"
        KUBECONFIG="{{ local_kubeconfig_path }}:{{ local_k3s_kubeconfig_path }}" kubectl config view --flatten > "${tmp_file}"
        mv "${tmp_file}" "{{ local_kubeconfig_path }}"
        chmod 0600 "{{ local_kubeconfig_path }}"
      args:
        executable: /bin/bash
      changed_when: true
      become: no
      delegate_to: localhost
      when: local_kubectl.rc == 0

    - name: Select lab context in default local kubeconfig
      ansible.builtin.command: >
        kubectl --kubeconfig {{ local_kubeconfig_path }}
        config use-context {{ k3s_context_name }}
      changed_when: true
      become: no
      delegate_to: localhost
      when:
        - local_kubectl.rc == 0
        - make_current_context | bool

    - name: Verify local cluster access
      ansible.builtin.command: >
        kubectl --kubeconfig {{ local_kubeconfig_path if local_kubectl.rc == 0 else local_k3s_kubeconfig_path }}
        get nodes -o wide
      register: local_nodes
      changed_when: false
      failed_when: false
      become: no
      delegate_to: localhost

    - name: Show local kubeconfig result
      ansible.builtin.debug:
        msg:
          - "Wrote: {{ local_k3s_kubeconfig_path }}"
          - "API: {{ k3s_server_url }}"
          - "{{ 'Merged into: ' ~ local_kubeconfig_path if local_kubectl.rc == 0 else 'kubectl is not installed locally; use KUBECONFIG=' ~ local_k3s_kubeconfig_path ~ ' after installing kubectl.' }}"
          - "{{ 'Current context: ' ~ k3s_context_name if local_kubectl.rc == 0 and make_current_context | bool else 'Current context unchanged.' }}"
          - "{{ local_nodes.stdout_lines if local_nodes.rc == 0 else 'Local kubectl verification skipped or failed: ' ~ local_nodes.stderr }}"
