---
# Full cyber-range lab platform deploy — runs all phases in order.
# Run each playbook individually for targeted operations, or this to do everything.
#
# Prerequisites:
#   - K3s cluster is up with KubeVirt platform installed (ansible/playbooks/k3s/site.yml completed)
#   - All nodes have nested virtualisation enabled (Proxmox cpu=host, +vmx/+svm)
#   - vars/lab.yml is populated (especially trainee_ssh_pub_key)
#   - lab-operator image built and pushed to lab_operator_image (see 02b-operator-deploy.yml)
#
# Usage:
#   ansible-playbook -i ../../inv/ansible_inventory.ini site.yml \
#     -e "lab_name=alice-corporate trainee_name=alice trainee_ssh_pub_key='ssh-ed25519 AAAA...'"

- name: Deploy lab-operator (kopf CRD controller)
  import_playbook: 02b-operator-deploy.yml

- name: Create lab instance
  import_playbook: 03-lab-create.yml
